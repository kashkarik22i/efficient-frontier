[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "efficient-frontier"
version = "0.1.0"
description = "Reusable scripts for processing and reporting on price series."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "certifi>=2023.7.22",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "scipy>=1.10",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
